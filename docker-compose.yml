services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: complyog
      POSTGRES_PASSWORD: complyog_secret
      POSTGRES_DB: complyog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complyog"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: complyog
      POSTGRES_PASSWORD: complyog_secret
      POSTGRES_DB: complyog
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
